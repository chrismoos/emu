name: build

on: [push, pull_request]

env:
  CARGO_TERM_COLOR: always

jobs:
  # Run tests once on Linux
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install dependencies
        run: sudo apt-get update && sudo apt-get install -y libudev-dev libasound2-dev cc65
      - uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry/index/
            ~/.cargo/registry/cache/
            ~/.cargo/git/db/
            target/
          key: ${{ runner.os }}-test-cargo-${{ hashFiles('**/Cargo.lock') }}
      - name: Run tests
        run: cargo test --release

  # Build Linux binaries (musl, via Alpine container)
  build-linux:
    needs: test
    strategy:
      fail-fast: false
      matrix:
        include:
          - target: x86_64-unknown-linux-musl
            os: ubuntu-latest
            make_target: linux-x86_64

    runs-on: ${{ matrix.os }}
    container: alpine:latest

    steps:
      - name: Install system dependencies
        run: |
          echo "https://dl-cdn.alpinelinux.org/alpine/edge/testing" >> /etc/apk/repositories
          apk add --no-cache build-base musl-dev alsa-lib-dev eudev-dev pkgconf curl bash git cc65 perl linux-headers

      - name: Build alsa-lib static
        run: |
          cd /tmp
          wget https://www.alsa-project.org/files/pub/lib/alsa-lib-1.2.13.tar.bz2
          tar xjf alsa-lib-1.2.13.tar.bz2
          cd alsa-lib-1.2.13
          ./configure --enable-static --disable-shared --prefix=/usr
          make -j$(nproc)
          make install

      - uses: actions/checkout@v4

      - name: Install Rust
        run: |
          curl --proto '=https' --tlsv1.2 -sSf https://sh.rustup.rs | sh -s -- -y --default-toolchain stable --target ${{ matrix.target }}
          echo "$HOME/.cargo/bin" >> $GITHUB_PATH

      - uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry/index/
            ~/.cargo/registry/cache/
            ~/.cargo/git/db/
            target/
          key: alpine-${{ matrix.target }}-cargo-${{ hashFiles('**/Cargo.lock') }}

      - name: Build
        run: make ${{ matrix.make_target }}

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: emu-${{ matrix.target }}
          path: "*.tar.gz"

  # Build Linux aarch64 (musl, via docker run — JS actions don't support Alpine containers on ARM64)
  build-linux-arm:
    needs: test
    runs-on: ubuntu-24.04-arm

    steps:
      - uses: actions/checkout@v4

      - name: Build in Alpine container
        run: |
          docker run --rm -v "${{ github.workspace }}:/workspace" -w /workspace alpine:latest sh -c '
            echo "https://dl-cdn.alpinelinux.org/alpine/edge/testing" >> /etc/apk/repositories &&
            apk add --no-cache build-base musl-dev alsa-lib-dev eudev-dev pkgconf curl bash git cc65 perl linux-headers &&
            cd /tmp &&
            wget https://www.alsa-project.org/files/pub/lib/alsa-lib-1.2.13.tar.bz2 &&
            tar xjf alsa-lib-1.2.13.tar.bz2 &&
            cd alsa-lib-1.2.13 &&
            ./configure --enable-static --disable-shared --prefix=/usr &&
            make -j$(nproc) &&
            make install &&
            cd /workspace &&
            curl --proto =https --tlsv1.2 -sSf https://sh.rustup.rs | sh -s -- -y --default-toolchain stable --target aarch64-unknown-linux-musl &&
            . /root/.cargo/env &&
            make linux-aarch64
          '

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: emu-aarch64-unknown-linux-musl
          path: "*.tar.gz"

  # Build native binaries for macOS and Windows
  build:
    needs: test
    strategy:
      fail-fast: false
      matrix:
        include:
          # macOS x86_64 - Intel runner
          - target: x86_64-apple-darwin
            os: macos-15-intel
            make_target: macos-x86_64

          # macOS aarch64 - Apple Silicon runner
          - target: aarch64-apple-darwin
            os: macos-15
            make_target: macos-aarch64

          # Windows x86_64 - cross compile from Linux
          - target: x86_64-pc-windows-gnu
            os: ubuntu-latest
            make_target: windows

    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4

      - name: Install Linux dependencies
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y libudev-dev libasound2-dev cc65

      - name: Install Windows cross-compilation tools
        if: matrix.target == 'x86_64-pc-windows-gnu'
        run: sudo apt-get install -y gcc-mingw-w64-x86-64 g++-mingw-w64-x86-64

      - name: Install macOS dependencies
        if: runner.os == 'macOS'
        run: brew install cc65

      - name: Add Rust target
        run: rustup target add ${{ matrix.target }}

      - uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry/index/
            ~/.cargo/registry/cache/
            ~/.cargo/git/db/
            target/
          key: ${{ runner.os }}-${{ matrix.target }}-cargo-${{ hashFiles('**/Cargo.lock') }}

      - name: Build
        run: make ${{ matrix.make_target }}

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: emu-${{ matrix.target }}
          path: "*.tar.gz"

  # Build WASM
  build-wasm:
    needs: test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install dependencies
        run: sudo apt-get update && sudo apt-get install -y libudev-dev libasound2-dev cc65

      - name: Add WASM target
        run: rustup target add wasm32-unknown-unknown

      - name: Install trunk
        run: |
          curl -Lo /tmp/trunk.tar.gz "https://github.com/trunk-rs/trunk/releases/download/v0.21.14/trunk-x86_64-unknown-linux-gnu.tar.gz"
          tar xzf /tmp/trunk.tar.gz -C /tmp
          mv /tmp/trunk ~/.cargo/bin/

      - uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry/index/
            ~/.cargo/registry/cache/
            ~/.cargo/git/db/
            target/
          key: ${{ runner.os }}-wasm-cargo-${{ hashFiles('**/Cargo.lock') }}

      - name: Build WASM
        run: |
          trunk build --release --no-default-features --features wasm
          chmod -R a+rX dist/

      - name: Upload WASM artifact
        uses: actions/upload-artifact@v4
        with:
          name: emu-wasm
          path: dist/

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          name: wasm-pages
          path: dist/

  # Create release with all artifacts
  release:
    needs: [build, build-linux, build-linux-arm, build-wasm]
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    steps:
      - name: Download all artifacts
        uses: actions/download-artifact@v4
        with:
          path: artifacts/
          pattern: emu-*
          merge-multiple: false

      - name: List artifacts
        run: find artifacts/ -type f

      - name: Upload combined release artifact
        uses: actions/upload-artifact@v4
        with:
          name: all-builds
          path: artifacts/

  # Deploy WASM to GitHub Pages
  deploy:
    needs: build-wasm
    if: github.ref == 'refs/heads/main'

    permissions:
      pages: write
      id-token: write

    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}

    runs-on: ubuntu-latest
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
        with:
          artifact_name: wasm-pages
