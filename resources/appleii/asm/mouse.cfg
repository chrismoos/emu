MEMORY {
    ROM: start = $0, size = 256, fill = yes;
}

SEGMENTS {
    HEADER:   load = ROM, type = ro, start = $0;
    FIRMWARE_ROUTINES: load = ROM, type = ro, start = $12;
    CODE: load = ROM, type = ro;
    UNIMPL: load = ROM, type = ro, start = $f4;
    FOOTER: load = ROM, type = ro, start = $fb;
}
